document.addEventListener('mouseup',e=>{if(e.target.closest('#add-pop'))return;setTimeout(()=>{const sel=getSelection();if(!sel||sel.isCollapsed||state.preview!=='original'||state.page!=='review')return;const nodeEl=n=>n.nodeType===1?n:n.parentElement;const p=nodeEl(sel.anchorNode).closest('.paper p[data-s]');if(!p||p!==nodeEl(sel.focusNode).closest('.paper p[data-s]'))return;const range=sel.getRangeAt(0);const before=document.createRange();before.selectNodeContents(p);before.setEnd(range.startContainer,range.startOffset);const d=state.documents[state.current];const si=Number(p.dataset.s),pi=Number(p.dataset.p);const text=COMPILED[d.template].sections[si].paragraphs[pi];let start=before.toString().length,end=start+range.toString().length;while(start<end&&/\s/.test(text[start]))start++;while(end>start&&/\s/.test(text[end-1]))end--;if(start>=end)return;pendingSel={docIndex:state.current,s:si,p:pi,start,end,value:text.slice(start,end),conflict:overlaps(d,si,pi,start,end)};showPop(range.getBoundingClientRect());});});
render();
</script>
