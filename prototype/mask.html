<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Mask</title>
<style>
:root{
  --bg:#F5F4F1;--desk:#D8D6D1;--sheet:#FFF;--elev:#FFF;--ink:#1D1D1F;--ink2:#6E6E73;--ink3:#A1A1A6;
  --line:rgba(29,29,31,.1);--fill:rgba(29,29,31,.055);--fill2:rgba(29,29,31,.1);
  --glass:rgba(255,255,255,.76);--glass2:rgba(255,255,255,.9);
  --zhu:#C43D27;--wash:#FBEAE5;--on-zhu:#FFF;--pill:#1D1D1F;--pill-fg:#FFF;
  --shadow-1:0 1px 2px rgba(29,29,31,.04),0 10px 30px -12px rgba(29,29,31,.12);
  --shadow-2:0 1px 3px rgba(29,29,31,.08),0 18px 50px -12px rgba(29,29,31,.24);
  --spring:cubic-bezier(.32,.72,0,1);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --doc:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --dock-mid:max(24px,calc(50vh - 262px));
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C1C1E;--desk:#000;--sheet:#29292B;--elev:#323234;--ink:#F5F5F7;--ink2:#A1A1A6;--ink3:#6E6E73;
  --line:rgba(245,245,247,.13);--fill:rgba(245,245,247,.08);--fill2:rgba(245,245,247,.15);
  --glass:rgba(50,50,52,.72);--glass2:rgba(50,50,52,.92);
  --zhu:#FF7A5C;--wash:rgba(255,122,92,.16);--on-zhu:#1D1D1F;--pill:#F5F5F7;--pill-fg:#1D1D1F;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 12px 34px -12px rgba(0,0,0,.5);
  --shadow-2:0 1px 3px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{overflow:hidden;background:var(--desk);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{padding:0;border:0;background:none;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 0 0 .5px var(--line),0 4px 14px -6px rgba(0,0,0,.14)}
.icon{display:grid;flex:none;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink2);transition:background-color .15s}
.icon:hover:not(:disabled){background:var(--fill)}
.icon:disabled{opacity:.35}
.grow{flex:1}

/* 两个窗口 */
.win{position:fixed;inset:0;overflow:hidden;background:var(--bg);transition:transform .55s var(--spring),border-radius .55s var(--spring),opacity .35s}
#bench{transform:translateY(102%)}
body[data-view=bench] #bench{transform:none}
body[data-view=bench] #chat{transform:scale(.94);border-radius:18px;opacity:.5}
body[data-sheet="1"] #bench{transform:scale(.965);border-radius:18px}

/* 顶部 */
.bar{position:absolute;z-index:15;top:12px;left:16px;right:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none}
.bar>*{pointer-events:auto}
.crumb{justify-self:start;display:flex;align-items:center;gap:3px;height:34px;padding:0 13px 0 8px;border-radius:17px;font-size:13px;color:var(--ink2)}
.crumb:hover{color:var(--ink)}
.bar-title{max-width:44vw;overflow:hidden;padding:7px 14px;border-radius:17px;font-size:13px;color:var(--ink2);white-space:nowrap;text-overflow:ellipsis}
.bar-tools{justify-self:end;display:flex;align-items:center;gap:8px}
.bar-tools .icon{width:34px;height:34px}
.bar-tools .icon.on{background:var(--pill);color:var(--pill-fg)}
.seg{display:flex;padding:2px;border-radius:17px}
.seg button{display:grid;place-items:center;width:38px;height:30px;border-radius:15px;color:var(--ink2);transition:background-color .2s,color .2s}
.seg button.on{background:var(--pill);color:var(--pill-fg)}

/* 底部唯一的操作区 */
.dock{position:absolute;z-index:20;left:50%;bottom:24px;display:flex;align-items:center;gap:2px;width:min(600px,calc(100% - 32px));min-height:60px;padding:8px;border-radius:30px;transform:translateX(-50%);background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 0 0 .5px var(--line),var(--shadow-2);transition:bottom .6s var(--spring)}
.dock[data-page=import],.dock[data-page=setup],.dock[data-page=done]{bottom:var(--dock-mid)}
.field{display:flex;flex:1;align-items:center;gap:9px;min-width:0;padding:0 8px 0 12px;color:var(--ink3)}
.field input,.field textarea{flex:1;min-width:0;height:44px;padding:11px 0;border:0;outline:0;background:none;color:var(--ink);font-size:15px;line-height:22px;resize:none}
.field ::placeholder{color:var(--ink3)}
#search::-webkit-search-cancel-button{display:none}
.field-text{overflow:hidden;color:var(--ink2);font-size:14px;white-space:nowrap;text-overflow:ellipsis}
.go{position:relative;display:grid;flex:none;place-items:center;width:44px;height:44px;border-radius:50%;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;transition:background-color .3s,color .2s,transform .3s var(--spring)}
.go:active:not(:disabled){transform:scale(.92)}
.ring{position:absolute;inset:0;opacity:0;transform:rotate(-90deg);transition:opacity .25s}
.ring circle{fill:none;stroke-width:2.5}
.ring .tr{stroke:var(--fill2)}
.ring .va{stroke:var(--zhu);stroke-dasharray:119.38;stroke-linecap:round;transition:stroke-dashoffset .5s var(--spring)}
.go.todo,.go.busy{color:var(--zhu)}
.go.todo .ring,.go.busy .ring{opacity:1}
.go.busy .ring{animation:spin 1.2s linear infinite}
.go.next{background:var(--pill);color:var(--pill-fg)}
.go.next:disabled{background:var(--fill2);color:var(--ink3)}
.go.send,.go.save{background:var(--zhu);color:var(--on-zhu);animation:ready .7s var(--spring)}
.go.quiet{background:var(--fill);color:var(--ink2)}
.go-in{display:grid;place-items:center;animation:pop .28s var(--spring)}
.menu{position:absolute;left:8px;bottom:calc(100% + 10px);min-width:172px;padding:6px;border-radius:16px;background:var(--elev);box-shadow:0 0 0 .5px var(--line),var(--shadow-2);transform-origin:12% 100%;animation:pop .22s var(--spring)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:10px;white-space:nowrap}
.menu button:hover:not(:disabled){background:var(--fill)}
.menu button:disabled{color:var(--ink3)}
.find{display:flex;flex:none;align-items:center;gap:0;margin-right:4px;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.find b{padding:0 3px;font-weight:600}
.find b.hot{color:var(--zhu)}
.find .icon{width:32px;height:32px}
.find .hide{color:var(--zhu)}

/* 居中页：选材料、准备环境、交接完成 */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:30px;overflow-y:auto;padding:72px 24px calc(var(--dock-mid) + 92px);animation:fade .4s}
.center>:first-child{margin-top:auto}
.ask{max-width:640px;font:500 25px/1.6 var(--doc);text-align:center;text-wrap:balance}
.quiet{display:flex;align-items:center;gap:6px;margin-top:-20px;color:var(--ink2);font-size:13px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 18px;max-width:1030px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;width:128px;text-align:center}
.slot{position:relative;display:grid;place-items:center;width:110px;height:148px;transition:transform .3s var(--spring)}
.tile:hover:not(:disabled) .slot{transform:translateY(-3px)}
.tile .mini{transition:opacity .25s,box-shadow .25s}
.tile:not(.on) .mini{opacity:.55;box-shadow:0 0 0 .5px var(--line)}
.tick{position:absolute;top:-7px;right:-7px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--ink3);color:transparent;transition:background-color .2s,box-shadow .2s}
.tile.on .tick{background:var(--pill);box-shadow:0 0 0 2px var(--bg);color:var(--pill-fg)}
.tile.locked .tick{background:var(--ink3);box-shadow:0 0 0 2px var(--bg);color:var(--sheet)}
.tile.off .tick{display:none}
.tile.off .mini{opacity:.35}
.tile.off .nm{color:var(--ink3)}
.nm{display:-webkit-box;overflow:hidden;font-size:13px;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-all}
.sub{margin-top:-6px;color:var(--ink3);font-size:12px}
.tile.add .slot{border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink3);transition:color .2s,box-shadow .2s,transform .3s var(--spring)}
.tile.add:hover .slot{box-shadow:inset 0 0 0 1.5px var(--ink3);color:var(--ink)}
body.dropping .tile.add .slot{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:2px;width:min(340px,100%)}
.stp{display:flex;align-items:center;gap:12px;padding:9px 4px;font-size:15px}
.stp small{margin-left:auto;color:var(--ink3);font-size:13px}
.tick-on{display:grid;flex:none;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pill);color:var(--pill-fg);animation:pop .28s var(--spring)}
.dial{position:relative;flex:none;width:22px;height:22px;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:3}
.dial .tr{stroke:var(--fill2)}
.dial .va{stroke:var(--ink);stroke-dasharray:56.5;transition:stroke-dashoffset .2s}
.papers{display:flex;justify-content:center;gap:18px}
.papers button{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink2);font-size:12px;transition:transform .3s var(--spring)}
.papers button:hover{transform:translateY(-3px)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:24px;background:var(--pill);color:var(--pill-fg);font-size:15px;font-weight:500;transition:transform .2s var(--spring)}
.cta:active{transform:scale(.97)}
.cta.hot{background:var(--zhu);color:var(--on-zhu)}

/* 缩略纸：真实比例的标注位置 */
.mini{--u:1;display:flex;flex-direction:column;gap:calc(var(--u)*2.3px);width:calc(var(--u)*52px);height:calc(var(--u)*70px);overflow:hidden;padding:calc(var(--u)*7px) calc(var(--u)*6px);border-radius:calc(var(--u)*4px);background:var(--sheet);box-shadow:var(--shadow-1)}
.mini i{position:relative;display:block;flex:none;height:calc(var(--u)*1.7px);border-radius:1px;background:var(--fill2)}
.mini i.c{align-self:center}
.mini b{position:absolute;top:calc(var(--u)*-.6px);bottom:calc(var(--u)*-.6px);border-radius:1px;background:var(--pill)}
.mini b.q{background:var(--zhu)}

/* 文档 */
.canvas{position:absolute;inset:0;overflow-y:auto;padding:76px 24px 120px;scrollbar-width:thin;scrollbar-color:var(--fill2) transparent;-webkit-mask-image:linear-gradient(transparent 40px,#000 76px,#000 calc(100% - 104px),transparent calc(100% - 44px));mask-image:linear-gradient(transparent 40px,#000 76px,#000 calc(100% - 104px),transparent calc(100% - 44px))}
.page{position:relative;width:min(720px,100%);margin:0 auto;padding:80px 84px 56px;border-radius:10px;background:var(--sheet);box-shadow:var(--shadow-1);font:17px/2.15 var(--doc);animation:fade .3s}
.page h1{margin-bottom:40px;font-size:26px;font-weight:600;line-height:1.5;letter-spacing:.14em;text-align:center}
.page h3{margin:34px 0 4px;font-size:17px;font-weight:600}
.page p{margin-bottom:8px;overflow-wrap:anywhere;transition:opacity .35s}
.page p.dim,.page h3.dim{opacity:.26}
.page table{width:100%;margin:12px 0 26px;border-collapse:collapse;font-size:15px;line-height:1.75}
.page th{padding:6px 10px 6px 0;border-bottom:1px solid var(--ink3);font-weight:600;text-align:left}
.page td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.flag{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;color:var(--ink2);font:13px var(--ui)}
.fine{margin-top:44px;color:var(--ink3);font:12px var(--ui);text-align:center}
.m{position:relative;margin:0 .06em;padding:.13em .34em;border-radius:.36em;background:linear-gradient(var(--pill),var(--pill)) left/0% 100% no-repeat;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .34s var(--spring),background-color .2s,color .2s,box-shadow .2s;outline-offset:3px}
.m.x{background-size:100% 100%;color:var(--pill-fg)}
.m.q{background-color:var(--wash);box-shadow:inset 0 0 0 1.5px var(--zhu);color:var(--zhu)}
.m.k{box-shadow:inset 0 -1.5px 0 var(--fill2)}
.m.k:hover,.m.on.k{background-color:var(--fill)}
.m.on.x{box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--ink3)}
.m.on.q{box-shadow:inset 0 0 0 2px var(--zhu),0 0 0 4px var(--wash)}
.m.hitting{box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--ink3)}
.m.cur{box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--ink)}
.page.ai .m.k{margin:0;padding:0;box-shadow:none}
.h{position:absolute;top:-.06em;bottom:-.06em;width:20px;color:var(--ink);cursor:ew-resize;touch-action:none;outline:none}
.m.q .h{color:var(--zhu)}
.h::before{content:"";position:absolute;top:0;bottom:0;left:9px;width:2px;background:currentColor}
.h::after{content:"";position:absolute;left:5.5px;width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 1.5px var(--sheet)}
.h:focus-visible::after{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink)}
.h.s{left:-10px}
.h.s::after{top:-7px}
.h.e{right:-10px}
.h.e::after{bottom:-7px}
.m.bad .h.e::after{animation:nudge 1.3s var(--spring) infinite}
body.dragging,body.dragging *{cursor:ew-resize!important;user-select:none}
body.dragging .h{pointer-events:none}
.hit{border-radius:.2em;background:var(--wash);box-shadow:inset 0 -2px 0 var(--zhu);color:var(--zhu)}
.hit.cur{outline:2px solid var(--zhu);outline-offset:1px}
.r{border-radius:.2em;box-shadow:inset 0 -1.5px 0 var(--ink3)}
::selection{background:var(--fill2)}

/* 弹出层：一处一个决定 */
.callout{position:absolute;z-index:10;width:max-content;min-width:204px;max-width:min(372px,calc(100vw - 32px));padding:8px;border-radius:18px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 0 0 .5px var(--line),var(--shadow-2);font:13px/1.4 var(--ui);transition:left .3s var(--spring),top .3s var(--spring);animation:pop .24s var(--spring)}
.callout::after{content:"";position:absolute;left:var(--tail,50%);width:12px;height:12px;margin-left:-6px;border-radius:2px;background:inherit;transform:rotate(45deg)}
.callout[data-side=top]::after{bottom:-5px}
.callout[data-side=bottom]::after{top:-5px}
.why{padding:3px 8px 5px;color:var(--ink2)}
.why.hot{color:var(--zhu)}
.co-row{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 6px 0 10px;border-radius:12px;color:var(--ink2);white-space:nowrap;transition:background-color .15s}
.chip:hover:not(:disabled){background:var(--fill)}
.chip:disabled{opacity:.4}
.chip.plain{padding:0 10px}
.chip.hot{background:var(--wash);color:var(--zhu)}
.pick{display:flex;overflow:hidden;padding:2px;border-radius:13px;background:var(--fill)}
.pick button{display:flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 12px 0 10px;border-radius:11px;white-space:nowrap;color:var(--ink);transition:background-color .2s,color .2s}
.pick button:hover:not(.on):not(.off){background:var(--fill)}
.pick button.on{background:var(--pill);color:var(--pill-fg)}
.pick button.keep.on{background:var(--sheet);box-shadow:0 0 0 .5px var(--line);color:var(--ink)}
.pick button.off{color:var(--ink3);cursor:not-allowed}
.sel-val{max-width:150px;overflow:hidden;padding:0 8px;font-weight:500;white-space:nowrap;text-overflow:ellipsis}
.choices{display:flex;flex-wrap:wrap;gap:4px;max-width:352px;margin-top:6px;padding-top:6px;border-top:.5px solid var(--line)}
.choices button{padding:5px 10px;border-radius:9px;color:var(--ink2)}
.choices button:hover{background:var(--fill)}
.choices button.on{background:var(--pill);color:var(--pill-fg)}
.choices.list{flex-direction:column;max-width:none}
.choices.list button{display:flex;gap:10px;text-align:left}

/* 材料栏 */
.rail{position:absolute;z-index:12;left:16px;top:64px;bottom:64px;display:flex;flex-direction:column;align-items:center;gap:18px;width:72px;overflow-y:auto;padding:8px 0;scrollbar-width:none}
.thumb{position:relative;flex:none;border-radius:5px;transition:transform .3s var(--spring)}
.thumb:hover{transform:scale(1.05)}
.thumb .mini{transition:opacity .25s}
.thumb.wait .mini{opacity:.45}
.thumb.on .mini{box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--ink)}
.badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--zhu);color:var(--on-zhu);font:600 11px/19px var(--ui);text-align:center}
.badge.ok{display:grid;place-items:center;padding:0;background:var(--pill);color:var(--pill-fg)}
.badge.dot{top:-3px;right:-3px;min-width:9px;width:9px;height:9px;padding:0}
.thumb .dial{position:absolute;left:15px;top:24px}
.rail .icon{width:40px;height:40px;color:var(--ink3)}

/* 待处理看板：主按钮背后的清单，一行一处 */
.board{position:absolute;z-index:13;left:104px;top:64px;display:flex;flex-direction:column;width:236px;max-height:calc(100% - 176px);border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 0 0 .5px var(--line),var(--shadow-1);transform-origin:0 0;animation:pop .3s var(--spring)}
.board:not(.open){width:auto}
.board-head{display:flex;flex:none;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-radius:20px;color:var(--ink2);font-size:13px}
.board-head b{margin-left:auto;color:var(--zhu);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.board-head svg{color:var(--ink3);transition:transform .3s var(--spring)}
.board:not(.open) .board-head svg{transform:rotate(-90deg)}
.legend{display:flex;flex:none;gap:14px;padding:0 16px 10px;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.legend .m{margin:0 5px 0 0;padding:.05em .45em;cursor:default}
.board-list{overflow-y:auto;padding:4px 6px 8px;border-top:.5px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--fill2) transparent}
.board-doc{overflow:hidden;padding:10px 10px 2px;color:var(--ink3);font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.brow{display:flex;flex-direction:column;gap:1px;width:100%;padding:6px 10px;border-radius:12px;text-align:left;transition:background-color .15s}
.brow:hover{background:var(--fill)}
.brow.on{background:var(--fill2)}
.brow-main{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.brow-main .m{display:inline-block;max-width:150px;margin:0;overflow:hidden;font:15px/1.6 var(--doc);white-space:nowrap;text-overflow:ellipsis}
.brow-type{flex:none;margin-left:auto;color:var(--ink3);font-size:12px}
.brow-hint,.brow-state{max-width:100%;overflow:hidden;color:var(--ink2);font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.brow-hint.hot,.brow-state.hot{color:var(--zhu)}
.brow-state{font-size:13px}
@media (min-width:1061px){.board.open~.canvas{padding-left:max(24px,calc(1456px - 100vw))}.canvas:has(~.inspector.open){padding-right:352px}.board.open~.canvas:has(~.inspector.open){padding-left:352px}}

/* 实体与代号 */
.inspector{position:absolute;z-index:18;top:56px;right:12px;bottom:12px;width:328px;overflow-y:auto;padding:12px 8px 16px;border-radius:22px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 0 0 .5px var(--line),var(--shadow-2);transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .5s var(--spring),visibility .5s}
.inspector.open{transform:none;visibility:visible}
.insp-head{display:flex;align-items:center;gap:6px;padding:2px 10px 6px;color:var(--ink3);font-size:12px}

  const outer=type==='公司'&&allCands(s).find(x=>x.c.decision==='mask'&&x.c.original.includes(original)&&s.entities[x.c.entity].type===type);
  return outer?outer.c.entity:newEntity(s,type);
}
function guessType(s,value){
  const same=allCands(s).find(x=>x.c.original===value);
  if(same)return s.entities[same.c.entity].type;
  if(/有限公司/.test(value))return '公司';
  if(/@/.test(value))return '邮箱';
  if(/^\d{11}$/.test(value))return '电话';
  if(/支行/.test(value))return '支行';
  if(/[A-Za-z]+-\d/.test(value))return '内部编号';
  return '人名';
}
function addCandidate(s,docIndex,si,pi,start,end,type){
  const d=s.documents[docIndex],original=COMPILED[d.template].sections[si].paragraphs[pi].slice(start,end);
  const c={id:'m'+s.nextManual++,s:si,p:pi,start,end,original,type,entity:entityFor(s,original,type),decision:'mask',reason:'你补录的',bad:false,manual:true};
  d.candidates.push(c);d.handed=false;return c;
}
function searchHits(s){
  const q=s.search.trim();if(!q)return [];
  const hits=[];
  scanned(s).forEach(d=>COMPILED[d.template].sections.forEach((sec,si)=>sec.paragraphs.forEach((text,pi)=>{
    let i=-1;
    while((i=text.indexOf(q,i+1))>=0)hits.push({docIndex:s.documents.indexOf(d),s:si,p:pi,start:i,end:i+q.length,marked:overlaps(d,si,pi,i,i+q.length)});
  })));
  return hits;
}
function selectFirst(s){const d=s.documents[s.current];s.selected=d&&d.scan>=100?d.candidates.find(c=>c.decision==='pending')?.id||null:null;}
const say=(s,text)=>s.chat.push({k:'text',text});
function setBulk(s,match,decision){allCands(s).filter(x=>match(x.c)&&!(decision==='mask'&&x.c.bad)).forEach(x=>{x.c.decision=decision;x.d.handed=false;});}
function startFlow(s,body){
  s.task=body;s.phase='working';s.page=s.setupDone?'import':'setup';
  if(HOSTS[s.host].auto){s.chat.push({k:'tool',text:'mask_start 运行中，已转后台'});say(s,`工作台已打开：${SESSION_URL}\n我没有读取任何文件。核对完成后自动继续。`);}
  else{s.chat.push({k:'tool',text:'mask_start 已返回'});say(s,`工作台已打开：${SESSION_URL}\n我没有读取任何文件。核对完成后回到这里发送“继续”。`);}
}
function deliver(s){s.chat.push({k:'tool',text:`mask_status 已交接 ${s.documents.filter(d=>d.handed).length} 份，读取 mask-handoff/`});s.chat.push({k:'report'});s.phase='analyzed';}

function reduce(state,a){
  const s=structuredClone(state),d=s.documents[s.current],c=d?.candidates.find(x=>x.id===s.selected);
  switch(a.type){
    case 'draft':s.draft=a.value;return s;
    case 'note':s.note=a.value;return s;
    case 'host':if(s.phase==='idle')s.draft=s.draft.replace(/^[/$]mask/,HOSTS[a.value].entry);s.host=a.value;return s;
    case 'win':s.view=a.value;s.menu=false;return s;
    case 'open':if(s.phase==='working'&&s.view==='chat'&&!s.opened){s.opened=true;s.view='bench';}return s;
    case 'send':{
      const raw=s.draft.trim();if(!raw)return state;
      const body=raw.replace(/^[/$]mask(?::\S+)?\s*/i,''),entry=body!==raw,h=HOSTS[s.host];
      if(/@\S+\.(docx?|pdf|txt)/i.test(raw)){s.chat.push({k:'hook',text:`未发送：@ 会把原件直接交给模型。\n去掉文件引用，用 ${h.entry} 在工作台选择。`});return s;}
      const names=['handed','analyzed'].includes(s.phase)?realNames(s).filter(n=>raw.includes(n)):[];
      if(names.length){s.chat.push({k:'hook',text:`未发送：含真名“${names[0]}”。\n可改写为：${maskText(s,raw)}`});return s;}
      s.chat.push({k:'user',text:raw});s.draft='';
      if(s.phase==='idle'){if(!entry||!body){say(s,`这条消息没有经过 Mask。处理文档请以 ${h.entry} 开头并写明需求。`);return s;}startFlow(s,body);return s;}
      if(s.phase==='paused'&&/继续/.test(body)){s.phase='working';s.view='bench';say(s,`工作台已恢复：${SESSION_URL}`);return s;}
      if(s.phase==='working'||s.phase==='paused'){const n=counts(s);say(s,`材料还没有交接。${n.pending?`工作台还有 ${n.pending} 处待确认。`:'请在工作台确认交接。'}\n${SESSION_URL}`);return s;}
      if(/还原/.test(body)){s.page='restore';s.view='bench';if(!s.restoreInput)s.restoreInput=reportMarkdown(s);say(s,`还原页已打开：${SESSION_URL}\n真名版只保存在本地，不回传对话。`);return s;}
      if(/补充/.test(body)){s.page='import';s.view='bench';s.phase='working';say(s,`材料列表已打开：${SESSION_URL}\n新材料沿用本项目代号。`);return s;}
      if(s.phase==='handed'){if(/继续/.test(body))deliver(s);else say(s,'脱敏稿已就绪。发送“继续”后我开始读取。');return s;}
      say(s,'继续使用 mask-handoff/ 中的脱敏稿，没有重新打开工作台。\n按严重程度排序：① 文件适用顺序与付款期限；② 违约金标准及上限；③ 签署与确认手续。');return s;
    }
    case 'addMore':s.page='import';s.phase='working';s.menu=false;return s;
    case 'pause':s.phase='paused';s.view='chat';s.menu=false;s.chat.push({k:'tool',text:'mask_start 已返回，进度已存在本地'});say(s,`核对已暂存。回来时发送 ${HOSTS[s.host].entry} 继续核对。`);return s;
    case 'toggleFile':{const f=s.dir.find(x=>x.key===a.key);if(f&&!f.unsupported&&!f.docId)f.checked=!f.checked;return s;}
    case 'addFiles':a.files.forEach(f=>s.dir.push({key:'c'+s.dir.length,name:f.name,format:f.format,template:s.dir.length%3,custom:true,checked:true}));return s;
    case 'startScan':{
      const fresh=s.dir.filter(f=>f.checked&&!f.docId);if(!fresh.length)return state;
      fresh.forEach(f=>{const doc=makeDocument(s.nextId++,f);f.docId=doc.id;s.documents.push(doc);});
      s.page='review';s.current=s.documents.findIndex(x=>x.scan<100);s.selected=null;return s;
    }
    case 'installStart':s.setupProgress=0;return s;
    case 'tick':{
      if(s.setupProgress!==null&&!s.setupDone){s.setupProgress=Math.min(100,s.setupProgress+4);if(s.setupProgress===100){s.setupDone=true;s.page='import';}return s;}
      const doc=s.documents.find(x=>x.scan<100);if(!doc)return state;
      doc.scan=Math.min(100,doc.scan+5);
      if(doc.scan===100&&s.documents[s.current]===doc)selectFirst(s);
      return s;
    }
    case 'selectDoc':s.current=a.index;s.sel=null;s.pick='';selectFirst(s);return s;
    case 'select':s.selected=a.id;s.preview='original';s.sel=null;s.pick='';return s;
    case 'blur':s.selected=null;s.pick='';s.menu=false;s.miss=null;return s;
    case 'jump':s.current=a.index;s.selected=a.id;s.preview='original';s.sel=null;s.pick='';return s;
    case 'preview':s.preview=a.value;s.selected=null;s.sel=null;s.pick='';s.miss=null;return s;
    case 'inspector':s.inspector=!s.inspector;return s;
    case 'board':s.boardOpen=a.value;return s;
    case 'menu':s.menu=!s.menu;return s;
    case 'pick':s.pick=s.pick===a.value?'':a.value;return s;
    case 'search':s.search=a.value;s.hit=-1;if(s.search)s.preview='original';return s;
    case 'hit':{
      const hits=searchHits(s);if(!hits.length)return state;
      s.hit=(s.hit+a.delta+hits.length)%hits.length;
      if(hits[s.hit].docIndex!==s.current){s.current=hits[s.hit].docIndex;s.selected=null;}
      return s;
    }
    case 'decision':if(!c||(a.value==='mask'&&c.bad))return state;c.decision=a.value;d.handed=false;return s;
    case 'merge':if(!c)return state;c.entity=c.suggest;c.decision='mask';d.handed=false;return s;
    case 'sync':if(!c||c.decision==='pending')return state;{const type=s.entities[c.entity].type,original=c.original,value=c.decision;setBulk(s,x=>x.original===original&&s.entities[x.entity].type===type,value);}return s;
    case 'bulkEntity':setBulk(s,x=>x.entity===a.id,a.value);return s;
    case 'entity':if(!c)return state;c.entity=a.value==='new'?newEntity(s,s.entities[c.entity].type):a.value;d.handed=false;s.pick='';return s;
    case 'type':if(!c)return state;c.entity=entityFor(s,c.original,a.value);d.handed=false;s.pick='';return s;
    case 'range':{
      if(!c)return state;
      const start=a.edge==='start'?a.offset:c.start,end=a.edge==='end'?a.offset:c.end,text=paraText(d,c);
      if(start<0||end>text.length||start>=end||overlaps(d,c.s,c.p,start,end,c.id)||(start===c.start&&end===c.end))return state;
      c.start=start;c.end=end;c.original=text.slice(start,end);c.bad=c.bad&&c.original.includes('（');d.handed=false;return s;
    }
    case 'sel':s.sel=a.value;s.selType=a.value?guessType(s,a.value.value):'';s.selected=null;s.pick='';return s;
    case 'clearSel':s.sel=null;s.pick='';return s;
    case 'selType':s.selType=a.value;s.pick='';return s;
    case 'addSel':{const m=s.sel,added=addCandidate(s,m.docIndex,m.s,m.p,m.start,m.end,s.selType);s.sel=null;s.pick='';s.selected=added.id;return s;}
    case 'addHits':{const type=guessType(s,s.search.trim());searchHits(s).filter(h=>!h.marked).forEach(h=>addCandidate(s,h.docIndex,h.s,h.p,h.start,h.end,type));return s;}
    case 'next':
      for(let offset=0;offset<s.documents.length;offset++){
        const index=(s.current+offset)%s.documents.length,hit=s.documents[index].scan>=100&&s.documents[index].candidates.find(x=>x.decision==='pending');
        if(hit){s.current=index;s.selected=hit.id;s.preview='original';s.sel=null;s.pick='';return s;}
      }
      s.selected=null;s.pick='';return s;
    case 'sheet':s.sheet=a.value;s.peek=null;s.menu=false;s.selected=null;s.sel=null;return s;
    case 'peek':s.peek=s.peek===a.value?null:a.value;return s;
    case 'handoff':
      if(!canRelease(s))return state;
      s.documents.forEach(x=>{x.handed=true;});s.task=s.task&&maskText(s,s.task);s.page='done';s.restoreInput='';s.preview='original';s.search='';s.inspector=false;
      if(HOSTS[s.host].auto)deliver(s);else s.phase='handed';
      return s;
    case 'toReview':s.page='review';s.current=a.index??s.current;s.selected=null;return s;
    case 'toDone':s.page='done';return s;
    case 'restoreInput':s.restoreInput=a.value;s.restoreFix={};s.miss=null;s.restored=false;s.preview='original';s.page=a.value.trim()?'restore':'done';return s;
    case 'miss':s.miss=s.miss===a.value?null:a.value;return s;
    case 'fix':s.restoreFix[a.token]=a.value;s.miss=null;s.restored=false;return s;
    case 'restored':s.restored=true;return s;
    default:return state;
  }
}
function fastForward(s){
  s.draft='';s.task=defaultTask;s.chat=[{k:'user',text:HOSTS[s.host].entry+' '+defaultTask}];
  startFlow(s,defaultTask);s.opened=true;s.view='bench';s.page='review';
  s.dir.filter(f=>f.checked).forEach(f=>{const doc=makeDocument(s.nextId++,f);f.docId=doc.id;doc.scan=100;s.documents.push(doc);});
  s.current=0;selectFirst(s);return s;
}
function resolveDemo(s){
  allCands(s).forEach(({c})=>{
    if(c.original==='联系人')c.decision='keep';
    if(c.original==='海岚'){c.entity='company2';c.decision='mask';}
    if(c.bad){c.end=c.start+8;c.original=c.original.slice(0,8);c.bad=false;c.decision='mask';}
  });
  s.documents.forEach(x=>{x.handed=true;});deliver(s);s.page='done';s.view='bench';return s;
}
function scenarioState(value,host){
  const s=initialState(host);s.scenario=value;
  if(value==='setup')s.setupDone=false;
  if(value==='review')fastForward(s);
  if(value==='project'){
    resolveDemo(fastForward(s));
    s.dir.splice(3,0,{key:'f6',name:'逾期付款催告函.docx',format:'DOCX',template:3,checked:true});
    s.page='import';s.phase='working';s.reused=true;s.task='补充一份催告函';
    s.chat.push({k:'user',text:HOSTS[host].entry+' 补充一份催告函'});say(s,`材料列表已打开：${SESSION_URL}\n新材料沿用本项目代号。`);
  }
  if(value==='restore'){resolveDemo(fastForward(s));s.page='restore';s.restoreInput=reportMarkdown(s);}
  return s;
}

<script>

const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS={

const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

// 把新 HTML 合入现有 DOM：节点保留，CSS 过渡、焦点、滚动和划选都不被重绘打断。
function syncNode(a,b){
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  const float=a.hasAttribute('data-float');
  for(const {name} of [...a.attributes])if(!b.hasAttribute(name)&&!(float&&(name==='style'||name==='data-side')))a.removeAttribute(name);
  for(const {name,value} of [...b.attributes])if(a.getAttribute(name)!==value)a.setAttribute(name,value);
  if(a.tagName==='INPUT'||a.tagName==='TEXTAREA'){if(!composing&&a.value!==b.value)a.value=b.value;if(a.tagName==='TEXTAREA')return;}
  syncKids(a,b);
}
const keyOf=n=>n.dataset?.k||'';
const alike=(x,y)=>x&&x.nodeType===y.nodeType&&x.nodeName===y.nodeName&&keyOf(x)===keyOf(y);
function syncKids(a,b){
  const keyed=new Map();a.childNodes.forEach(n=>{if(keyOf(n))keyed.set(keyOf(n),n);});
  let cur=a.firstChild;
  [...b.childNodes].forEach(nb=>{
    const m=keyOf(nb)?keyed.get(keyOf(nb)):(alike(cur,nb)?cur:null);
    if(!m||m.nodeName!==nb.nodeName){a.insertBefore(nb,cur);return;}
    if(m===cur)cur=cur.nextSibling;else a.insertBefore(m,cur);
    syncNode(m,nb);
  });
  while(cur){const n=cur.nextSibling;cur.remove();cur=n;}
}
function patch(root,html){const t=document.createElement('template');t.innerHTML=html;syncKids(root,t.content);}

// 缩略纸
const COLS=26,MAX_LINES=17;
function miniLines(template){
  const lines=[{w:44,center:true}];
  COMPILED[template].sections.forEach((sec,si)=>{
    lines.push({w:Math.min(50,sec.title.length*6)});
    sec.paragraphs.forEach((text,pi)=>{
      const n=Math.max(1,Math.ceil(text.length/COLS));
      for(let i=0;i<n;i++)lines.push({w:i===n-1?Math.max(14,((text.length-i*COLS)/COLS)*100):100,s:si,p:pi,from:i*COLS});
    });
  });
  return lines.slice(0,MAX_LINES);
}
const reached=(d,si,pi)=>{
  if(d.scan>=100)return true;
  const secs=COMPILED[d.template].sections,total=secs.reduce((n,x)=>n+x.paragraphs.length,0);
  const before=secs.slice(0,si).reduce((n,x)=>n+x.paragraphs.length,0)+pi;
  return (before+1)/total*100<=d.scan;
};
function mini(source,scale=1){
  // source: {template, doc?}；未知内容的文件只画空行。
  if(source?.template==null)return `<span class="mini" style="--u:${scale}">${[44,70,100,100,86,0,100,100,62].map(w=>`<i ${w===44?'class="c"':''} style="width:${w}%"></i>`).join('')}</span>`;
  const d=source.doc;
  const lines=miniLines(source.template).map(l=>{
    const segs=d?d.candidates.filter(c=>c.s===l.s&&c.p===l.p&&c.decision!=='keep'&&reached(d,c.s,c.p)&&c.end>l.from&&c.start<l.from+COLS).map(c=>{
      const a=Math.max(c.start,l.from),b=Math.min(c.end,l.from+COLS);
      return `<b class="${c.decision==='pending'?'q':''}" style="left:${(a-l.from)/COLS*100}%;width:${(b-a)/COLS*100}%"></b>`;
    }).join(''):'';
    return `<i ${l.center?'class="c"':''} style="width:${l.w}%">${segs}</i>`;
  }).join('');
  return `<span class="mini" style="--u:${scale}">${lines}</span>`;
}

// 主按钮：有待办时带你去下一处，清零后才变成发送。方向表示数据去向：→ 留在本机，↑ 发给 AI，↓ 存到本地。
function go({cls,a='',label,inner,pct=0,disabled=false,key}){
  return `<button class="go ${cls}" ${a?`data-a="${a}"`:''} aria-label="${esc(label)}" title="${esc(label)}" ${disabled?'disabled':''}><svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="tr" cx="22" cy="22" r="19"/><circle class="va" cx="22" cy="22" r="19" style="stroke-dashoffset:${(119.38*(1-pct)).toFixed(2)}"/></svg><span class="go-in" data-k="${esc(key)}">${inner}</span></button>`;
}
function reviewGo(){
  const c=counts(state),total=c.pending+c.masked+c.kept,pct=total?(c.masked+c.kept)/total:0;
  if(c.scanning)return go({cls:'busy',a:c.pending?'next':'',label:'本地识别中',inner:c.pending||'',pct:.28,key:'busy'+c.pending});
  if(c.pending)return go({cls:'todo',a:'next',label:`下一处待确认，还剩 ${c.pending} 处（J）`,inner:c.pending,pct,key:'n'+c.pending});
  if(canRelease(state))return go({cls:'send',a:'release',label:`交给 ${state.host}`,inner:icon('up',20),key:'send'});

    +dock('done',`${moreMenu([['export','share','导出原格式',!canExport(state)],['add-more','plus','补充材料']])}<label class="field"><textarea id="paste" rows="1" aria-label="AI 结果" placeholder="粘贴 AI 结果，还原真名">${esc(state.restoreInput)}</textarea></label>${go({cls:'next',label:'保存真名版',inner:icon('down',20),disabled:true,key:'save-off'})}`);
}
function restoreInline(line,r){
  const code=state.preview==='masked';let out='',last=0;
  for(const m of line.matchAll(TAG_RE)){
    const t=m[0],fix=state.restoreFix[t],real=r.map[t]??(fix&&fix!=='keep'?r.map[fix]:null);
    out+=esc(line.slice(last,m.index));last=m.index+t.length;
    if(real)out+=`<span class="r">${esc(code?t:real)}</span>`;
    else if(fix==='keep')out+=`<span class="m k">${esc(t)}</span>`;
    else out+=`<span class="m q ${state.miss===t?'on':''}" data-a="miss" data-v="${esc(t)}" role="button" tabindex="0" aria-label="没有映射：${esc(t)}">${esc(t)}</span>`;
  }
  return out+esc(line.slice(last));
}
function restorePaper(r){
  let html='',table=[];
  const flush=()=>{if(!table.length)return;html+=`<table><thead><tr>${table[0].map(x=>`<th>${restoreInline(x,r)}</th>`).join('')}</tr></thead><tbody>${table.slice(1).map(row=>`<tr>${row.map(x=>`<td>${restoreInline(x,r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;table=[];};
  state.restoreInput.split('\n').forEach(line=>{
    if(line.startsWith('|')){if(!/^\|\s*-/.test(line))table.push(line.split('|').slice(1,-1).map(x=>x.trim()));return;}
    flush();
    if(line.startsWith('# '))html+=`<h1>${restoreInline(line.slice(2),r)}</h1>`;
    else if(line.trim())html+=`<p>${restoreInline(line,r)}</p>`;
  });
  flush();
  const co=state.miss?`<div class="callout" data-k="co" data-float role="dialog" aria-label="${esc(state.miss)}"><p class="why hot">映射中没有这个代号</p><div class="choices list" style="margin:0;padding:0;border:0">${Object.entries(r.map).map(([t,v])=>`<button data-a="fix" data-v="${esc(t)}">${esc(t)}<span style="color:var(--ink3)">${esc(v)}</span></button>`).join('')}<button data-a="fix" data-v="keep">${icon('eye',14)} 保留代号</button></div></div>`:'';
  return `<article class="page" data-k="restored">${html}${co}</article>`;
}
function restorePage(){
  const r=restoreInfo(state),partial=r.kept.length>0;
  const status=!r.tokens.length?'没有检测到代号':r.missing.length?`${r.missing.length} 个代号没有映射`:state.restored?'已保存到本地':partial?`部分还原，${r.kept.length} 个代号未映射`:`完整还原 ${r.replaced} 处`;
  const primary=r.missing.length?go({cls:'todo',a:'next-miss',label:'下一处没有映射的代号',inner:r.missing.length,pct:r.tokens.length?(r.tokens.length-r.missing.length)/r.tokens.length:0,key:'m'+r.missing.length}):state.restored?go({cls:'quiet',label:'已保存',inner:icon('check',20),disabled:true,key:'saved'}):go({cls:'save',a:'save-restored',label:partial?'保存部分还原版':'保存真名版',inner:icon('down',20),disabled:!r.replaced,key:'save'});
  return bar({title:'AI 结果',tools:viewSeg('真名','代号',['eye','eyeOff'])})+`<main class="canvas" id="canvas" data-k="p-restore">${restorePaper(r)}</main>`+dock('restore',`<button class="icon" data-a="clear-restore" title="换一份" aria-label="换一份">${icon('x',18)}</button><div class="field" style="padding-left:2px"><span class="field-text" role="status">${esc(status)}</span></div>${primary}`);
}
function benchView(){
  const pages={setup:setupPage,import:selectPage,review:reviewPage,done:donePage,restore:restorePage};
  return pages[state.page]()+`<div class="hud ${hud?'on':''}" data-k="hud" role="status">${esc(hud)}</div>`;
}
function noticeHtml(){
  const notices=state.documents.filter(d=>d.notice);
  return notices.length?`<div class="warn">${icon('info',16)}<span>${notices.map(d=>`${esc(d.name)}：${esc(d.notice)}`).join('<br>')}，按部分处理记录</span></div>`:'';
}
function handoffSheet(){
  const byType={},c=counts(state),docs=state.documents.filter(d=>!d.handed),note=state.note.trim(),h=esc(state.host);
  maskedCands(state).forEach(x=>{const t=state.entities[x.c.entity].type;byType[t]=(byType[t]||0)+1;});
  const peek=state.peek==='note'?maskText(state,note):state.peek!=null?docMarkdown(state,docs[state.peek]):'';
  return `<div class="scrim" data-a="close-sheet"></div><section class="modal" role="dialog" aria-modal="true" aria-label="确认交接"><button class="x" data-a="close-sheet" aria-label="关闭">${icon('x',15)}</button><div class="papers" style="padding-top:6px">${docs.map((d,i)=>`<button data-a="peek" data-v="${i}" aria-pressed="${state.peek===i}" title="预览材料 ${i+1}">${mini({template:d.template,doc:d},1.15)}材料 ${i+1}</button>`).join('')}</div>${peek?`<pre tabindex="0">${esc(peek)}</pre>`:''}<div class="tally">${Object.entries(byType).map(([t,n])=>`<span class="tag">${t}<b>${n}</b></span>`).join('')}<span class="tag k">保留<b>${c.kept}</b></span><span class="tag k">补录<b>${c.manual}</b></span></div>${noticeHtml()}<div class="split"><div><span>${icon('up',15)}发给 ${h}</span><small>${docs.length} 份脱敏稿${note?'、脱敏后的补充说明':''}</small></div><div><span>${icon('lock',15)}留在本机</span><small>原件、文件名、代号表</small></div></div><button class="cta hot" id="confirm" data-a="confirm-handoff">${icon('up',18)}交给 ${h}</button></section>`;
}
function exportSheet(){
  return `<div class="scrim" data-a="close-sheet"></div><section class="modal" role="dialog" aria-modal="true" aria-label="导出原格式"><button class="x" data-a="close-sheet" aria-label="关闭">${icon('x',15)}</button><div class="rows" style="padding-top:22px">${state.documents.map(d=>`<div><span>${esc(d.name.replace(/\.(\w+)$/,'.脱敏.$1'))}</span><small>${esc(d.format)}</small></div>`).join('')}</div>${noticeHtml()}<button class="cta" id="confirm" data-a="confirm-export">${icon('down',18)}导出到 mask-export/</button></section>`;
}
function protoView(){
  const hints={setup:'',review:'试试：查找“张三”；划选 XH-2026-018',project:'新材料沿用原代号',restore:'<公司[9].公司.名称> 没有映射',full:''};
  const scenes=[['full','完整流程'],['setup','首次使用'],['review','核对查漏'],['project','项目续接'],['restore','结果还原']];
  return `<button class="proto-btn" data-a="proto" aria-expanded="${protoOpen}">原型</button>${protoOpen?`<div class="proto-panel"><div class="proto-group">${Object.keys(HOSTS).map(x=>`<button class="${x===state.host?'on':''}" data-a="host" data-v="${x}">${x}</button>`).join('')}</div><div class="proto-group">${scenes.map(([v,l])=>`<button class="${v===state.scenario?'on':''}" data-a="scenario" data-v="${v}">${l}</button>`).join('')}</div>${hints[state.scenario]?`<p>${hints[state.scenario]}</p>`:''}</div>`:''}`;
}

function placeCallout(){
  const co=document.querySelector('.callout');if(!co)return;
  const page=co.parentElement,P=page.getBoundingClientRect(),box=$('canvas').getBoundingClientRect();
  const mark=page.querySelector('.m.on'),v=state.sel;
  const A=mark?(r=>({left:r.left-P.left,top:r.top-P.top,width:r.width,height:r.height}))(mark.getBoundingClientRect()):v?.rect;
  if(!A)return;
  const w=co.offsetWidth,h=co.offsetHeight,cx=A.left+A.width/2,left=Math.max(8,Math.min(P.width-w-8,cx-w/2));
  const above=A.top+P.top-box.top-56>h+18;
  co.style.left=left+'px';co.style.top=(above?A.top-h-16:A.top+A.height+16)+'px';
  co.dataset.side=above?'top':'bottom';co.style.setProperty('--tail',Math.max(20,Math.min(w-20,cx-left))+'px');
}
function render(){
  const b=document.body;b.dataset.view=state.view;b.dataset.sheet=state.sheet?'1':'';
  patch($('chat'),chatView());patch($('bench'),benchView());patch($('overlay'),state.sheet==='handoff'?handoffSheet():state.sheet==='export'?exportSheet():'');patch($('proto'),protoView());
  $('chat').inert=state.view!=='chat';$('bench').inert=state.view!=='bench'||!!state.sheet;
  placeCallout();
  if(state.chat.length!==lastChatLength){lastChatLength=state.chat.length;const th=$('thread');if(th)th.scrollTop=th.scrollHeight;}
}
function reveal(selector='.m.on'){
  requestAnimationFrame(()=>{
    const box=$('canvas'),el=box?.querySelector(selector);if(!el)return;
    const b=box.getBoundingClientRect(),r=el.getBoundingClientRect();
    box.scrollTo({top:box.scrollTop+r.top-b.top-box.clientHeight*.42,behavior:motionOK()?'smooth':'auto'});
  });
}
function notify(text){hud=text;render();clearTimeout(hudTimer);hudTimer=setTimeout(()=>{hud='';render();},2600);}
function ensureTicker(){
  if(ticker)return;
  ticker=setInterval(()=>{
    const busy=(state.setupProgress!==null&&!state.setupDone)||state.documents.some(d=>d.scan<100);
    if(!busy){clearInterval(ticker);ticker=null;return;}
    const before=state.selected;
    state=reduce(state,{type:'tick'});render();
    if(state.selected&&state.selected!==before)reveal();
  },90);
}
function dispatch(action){
  const before=state;state=reduce(state,action);render();
  if(before.phase==='idle'&&state.phase==='working'&&state.view==='chat')setTimeout(()=>dispatch({type:'open'}),900);
  return state;
}
function addFiles(files){
  const selected=[...files],accepted=selected.filter(f=>/\.(txt|docx|pdf)$/i.test(f.name));
  if(!accepted.length){notify('只支持 TXT、DOCX、PDF');return;}
  dispatch({type:'addFiles',files:accepted.map(f=>({name:f.name,format:f.name.split('.').pop().toUpperCase()}))});
  if(accepted.length<selected.length)notify('其余格式未加入');
}
function decide(value){
  const d=state.documents[state.current],c=d?.candidates.find(x=>x.id===state.selected);if(!c)return;
  if(value==='mask'&&c.bad)return;
  const wasPending=c.decision==='pending';
  dispatch({type:'decision',value});
  // Identical pending occurrences keep the callout in place so the sync chip can be used.
  if(wasPending&&!samePending(c))advance(c.id);
}
function samePending(c){
  const type=state.entities[c.entity].type;
  return allCands(state).some(x=>x.c.id!==c.id&&x.c.original===c.original&&state.entities[x.c.entity].type===type&&x.c.decision==='pending');
}
function advance(id){setTimeout(()=>{if(state.selected===id){dispatch({type:'next'});reveal();}},motionOK()?340:0);}
function scenario(value){state=scenarioState(value,state.host);lastChatLength=-1;render();ensureTicker();}
const ACTIONS={
  win:t=>dispatch({type:'win',value:t.dataset.v}),
  fill:t=>{dispatch({type:'draft',value:t.dataset.v});$('draft').focus();},
  send:()=>dispatch({type:'send'}),
  'pick-file':()=>$('picker').click(),
  install:()=>{dispatch({type:'installStart'});ensureTicker();},
  toggle:t=>dispatch({type:'toggleFile',key:t.dataset.v}),
  'start-scan':()=>{dispatch({type:'startScan'});ensureTicker();},
  doc:t=>dispatch({type:'selectDoc',index:+t.dataset.v}),
  mark:t=>dispatch({type:'select',id:t.dataset.v}),
  jump:t=>{
    dispatch({type:'jump',index:+t.dataset.i,id:t.dataset.v});
    // 窄屏上实体面板盖住正文，跳过去后收起。
    if(state.inspector&&matchMedia('(max-width:1060px)').matches)dispatch({type:'inspector'});
    reveal();
  },
  preview:t=>dispatch({type:'preview',value:t.dataset.v}),
  inspector:()=>dispatch({type:'inspector'}),
  board:t=>dispatch({type:'board',value:t.getAttribute('aria-expanded')!=='true'}),
  todo:t=>{
    dispatch(t.dataset.v?{type:'jump',index:+t.dataset.i,id:t.dataset.v}:{type:'selectDoc',index:+t.dataset.i});
    // 窄屏上看板盖住正文，跳过去后收起。
    if(matchMedia('(max-width:1060px)').matches)dispatch({type:'board',value:false});
    reveal();
  },
  menu:()=>dispatch({type:'menu'}),
  pick:t=>dispatch({type:'pick',value:t.dataset.v}),
  type:t=>dispatch({type:'type',value:t.dataset.v}),
  entity:t=>dispatch({type:'entity',value:t.dataset.v}),
  'sel-type':t=>dispatch({type:'selType',value:t.dataset.v}),
  mask:()=>decide('mask'),
  keep:()=>decide('keep'),
  merge:()=>{const id=state.selected;dispatch({type:'merge'});advance(id);},
  sync:()=>{const id=state.selected;dispatch({type:'sync'});notify('已同步');advance(id);},
  'bulk-entity':t=>dispatch({type:'bulkEntity',id:t.dataset.i,value:t.dataset.v}),
  'add-sel':()=>{dispatch({type:'addSel'});getSelection().removeAllRanges();},
  'add-hits':()=>dispatch({type:'addHits'}),
  hit:t=>{dispatch({type:'hit',delta:+t.dataset.v});reveal('.cur');},
  next:()=>{dispatch({type:'next'});reveal();},
  'add-more':()=>dispatch({type:'addMore'}),
  pause:()=>dispatch({type:'pause'}),
  release:()=>{dispatch({type:'sheet',value:'handoff'});$('confirm')?.focus();},
  export:()=>{dispatch({type:'sheet',value:'export'});$('confirm')?.focus();},
  'close-sheet':()=>dispatch({type:'sheet',value:''}),
  peek:t=>dispatch({type:'peek',value:+t.dataset.v}),
  'confirm-handoff':()=>{
    dispatch({type:'sheet',value:''});document.body.classList.add('flying');
    setTimeout(()=>{document.body.classList.remove('flying');dispatch({type:'handoff'});},motionOK()?520:0);
  },
  'confirm-export':()=>{dispatch({type:'sheet',value:''});notify('示例：已导出到 mask-export/，未生成真实文件');},
  'to-done':()=>dispatch({type:'toDone'}),
  'open-doc':t=>dispatch({type:'toReview',index:+t.dataset.v}),
  'back-host':()=>{if(state.phase==='handed')state=reduce(state,{type:'draft',value:'继续'});dispatch({type:'win',value:'chat'});},
  miss:t=>dispatch({type:'miss',value:t.dataset.v}),
  'next-miss':()=>{dispatch({type:'miss',value:restoreInfo(state).missing[0]});reveal();},
  fix:t=>dispatch({type:'fix',token:state.miss,value:t.dataset.v}),
  'clear-restore':()=>dispatch({type:'restoreInput',value:''}),
  'save-restored':()=>{dispatch({type:'restored'});notify('示例：已存到 mask-restored/，未回传对话');},
  proto:()=>{protoOpen=!protoOpen;render();},
  host:t=>dispatch({type:'host',value:t.dataset.v}),
  scenario:t=>scenario(t.dataset.v)
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(t){if(!t.disabled)ACTIONS[t.dataset.a]?.(t);return;}
  if(state.view==='bench'&&!e.target.closest('.callout,.menu,.inspector,.board,#proto')&&(state.selected||state.menu||state.miss))dispatch({type:'blur'});
});
function onInput(e){
  const id=e.target.id,v=e.target.value;
  if(id==='draft')dispatch({type:'draft',value:v});
  if(id==='note')dispatch({type:'note',value:v});
  if(id==='search')dispatch({type:'search',value:v});
  if(id==='paste'&&v.trim())dispatch({type:'restoreInput',value:v});
}
document.addEventListener('input',e=>{if(!e.isComposing)onInput(e);});
document.addEventListener('compositionstart',()=>{composing=true;});
document.addEventListener('compositionend',e=>{composing=false;onInput(e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='draft'&&!e.isComposing){e.preventDefault();dispatch({type:'send'});return;}
  if(e.key==='Enter'&&e.target.id==='search'){dispatch({type:'hit',delta:1});reveal('.cur');return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button],[role=link]')){e.preventDefault();e.target.click();return;}
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&e.target.matches('.h')){
    e.preventDefault();e.stopPropagation();
    const d=state.documents[state.current],c=d.candidates.find(x=>x.id===state.selected),delta=e.key==='ArrowLeft'?-1:1;
    dispatch({type:'range',edge:e.target.dataset.edge,offset:(e.target.dataset.edge==='start'?c.start:c.end)+delta});
    return;
  }
  // Review shortcuts: K keep, M mask, S sync identical occurrences, J next pending.
  const key=!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.isComposing&&state.view==='bench'&&state.page==='review'&&!state.sheet
    &&!e.target.closest('input,textarea,[contenteditable]')&&{k:'keep',m:'mask',s:'sync',j:'next'}[e.key.toLowerCase()];
  if(key){
    const button=key==='next'?document.querySelector('.dock [data-a=next]'):document.querySelector(`.callout [data-a=${key}]`);
    if(button&&!button.disabled){e.preventDefault();ACTIONS[key]();}
    return;
  }
  if(e.key==='Escape'){
    if(state.sheet)dispatch({type:'sheet',value:''});
    else if(state.sel)dispatch({type:'clearSel'});
    else if(state.selected||state.menu||state.miss)dispatch({type:'blur'});
    else if(state.inspector)dispatch({type:'inspector'});
  }
});
$('picker').addEventListener('change',e=>{addFiles(e.target.files);e.target.value='';});
const canDrop=()=>state.view==='bench'&&state.page==='import';
document.addEventListener('dragover',e=>{if(canDrop()){e.preventDefault();document.body.classList.add('dropping');}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dropping');});
document.addEventListener('drop',e=>{document.body.classList.remove('dropping');if(canDrop()){e.preventDefault();addFiles(e.dataTransfer.files);}});
addEventListener('resize',placeCallout);
matchMedia('(max-width:1060px)').addEventListener('change',()=>render());

// 拖手柄改范围
function offsetAt(x,y){
  const p=document.querySelector('.m.on')?.closest('p');if(!p)return null;
  const pos=document.caretPositionFromPoint?.(x,y),range=pos?{node:pos.offsetNode,offset:pos.offset}:(r=>r&&{node:r.startContainer,offset:r.startOffset})(document.caretRangeFromPoint?.(x,y));
  if(!range||!p.contains(range.node))return null;
  const before=document.createRange();before.selectNodeContents(p);before.setEnd(range.node,range.offset);
  return before.toString().length;
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.h');if(!h)return;
  e.preventDefault();drag=h.dataset.edge;document.body.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const offset=offsetAt(e.clientX,e.clientY);
  if(offset!=null)dispatch({type:'range',edge:drag,offset});
});
document.addEventListener('pointerup',()=>{drag=null;document.body.classList.remove('dragging');});

// 划选补录
document.addEventListener('mousedown',e=>{if(state.sel&&!e.target.closest('.callout'))dispatch({type:'clearSel'});});
document.addEventListener('mouseup',e=>{
  if(drag||e.target.closest('.callout,.dock,.bar,.rail,.inspector'))return;
  setTimeout(()=>{
    const sel=getSelection();
    if(!sel||sel.isCollapsed||state.preview!=='original'||state.page!=='review'||state.view!=='bench')return;
    const el=n=>n.nodeType===1?n:n.parentElement,p=el(sel.anchorNode).closest('.page p[data-s]');
    if(!p||p!==el(sel.focusNode).closest('.page p[data-s]'))return;
    const range=sel.getRangeAt(0),before=document.createRange();
    before.selectNodeContents(p);before.setEnd(range.startContainer,range.startOffset);
    const d=state.documents[state.current],si=+p.dataset.s,pi=+p.dataset.p,text=COMPILED[d.template].sections[si].paragraphs[pi];
    let start=before.toString().length,end=start+range.toString().length;
    while(start<end&&/\s/.test(text[start]))start++;
    while(end>start&&/\s/.test(text[end-1]))end--;
    if(start>=end)return;
    const r=range.getBoundingClientRect(),P=p.closest('.page').getBoundingClientRect();
    dispatch({type:'sel',value:{docIndex:state.current,s:si,p:pi,start,end,value:text.slice(start,end),conflict:overlaps(d,si,pi,start,end),rect:{left:r.left-P.left,top:r.top-P.top,width:r.width,height:r.height}}});
  });
});
if(!window.MASK_LIVE)render();
</script>
